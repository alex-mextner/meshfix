[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "meshfix"
version = "0.1.1"
description = "Triangle mesh repair (holes, flipped faces, non-manifold edges, T-junctions, islands) with a stable C ABI"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Mextner" }]
keywords = ["mesh", "3d-printing", "stl", "repair", "watertight", "manifold"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.21"]
test = ["pytest>=7", "numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/alex-mextner/meshfix"
Issues = "https://github.com/alex-mextner/meshfix/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/meshfix"]
# The library is loaded with ctypes, so the wheel does not depend on the Python version.
wheel.py-api = "py3"
cmake.build-type = "Release"
sdist.include = ["include", "src", "cli", "tests", "cmake", "CMakeLists.txt", "python", "bench", "README.md", "LICENSE"]

[tool.scikit-build.cmake.define]
MESHFIX_BUILD_TESTS = "OFF"
MESHFIX_BUILD_CLI = "OFF"
MESHFIX_BUILD_STATIC = "OFF"
MESHFIX_INSTALL = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python", "tests/python"]
