name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pytest
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: CTest (C ABI, C example, Python tests, Python example)
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASan + UBSan build and test
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DMESHFIX_BUILD_SHARED=OFF
          cmake --build build-asan --parallel
          ctest --test-dir build-asan --output-on-failure -R "meshfix_c_api|meshfix_example_c"

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip install . and run the Python tests against the installed wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install . numpy pytest
          cd /tmp && MESHFIX_LIBRARY= /tmp/venv/bin/python -c "import meshfix; print(meshfix.version(), meshfix.__file__)"
          cd "$GITHUB_WORKSPACE/tests/python" && /tmp/venv/bin/python -m pytest -q -p no:cacheprovider -c wheel-pytest.ini
